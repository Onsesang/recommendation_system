<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/B 비교 검수</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --line: #dde2e8;
  --accent: #2f5bd3; --accent-soft: #e6ecfb; --ok: #1f8a4c; --ok-soft: #e3f4ea; --na: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171c; --panel: #1d2128; --text: #e7ebf0; --muted: #9aa4b2; --line: #2f353f;
          --accent: #7ea2ff; --accent-soft: #24304d; --ok: #5cc98a; --ok-soft: #1c3527; --na: #a3aab5; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
button, select, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1300px; margin: 0 auto; }
.bar h1 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.progress { flex: 1 1 200px; min-width: 160px; }
.track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: var(--ok); width: 0; transition: width .2s; }
.ctl { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
main { max-width: 1300px; margin: 0 auto; padding: 16px; }
.nav { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.arrow { font-size: 26px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; flex: none; }
.arrow:disabled { opacity: .35; cursor: default; }
.head { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.head .id { font-size: 13px; color: var(--muted); }
.head .msg { font-size: 20px; font-weight: 650; word-break: keep-all; }
.chips { margin-top: 4px; font-size: 13px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; margin: 1px 3px 1px 0; background: var(--accent-soft); color: var(--accent); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.side.win { border-color: var(--ok); background: var(--ok-soft); }
.side h2 { margin: 0 0 8px; font-size: 18px; }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; }
.item .t { font-size: 12.5px; overflow-wrap: anywhere; }
.item .n { font-weight: 700; }
.choice { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 0 8px; }
.choice button { min-height: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 16px; cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel); }
.state { font-size: 12px; color: var(--muted); min-height: 16px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 10; overflow: auto; }
.overlay.open { display: flex; }
.sheet { background: var(--panel); border-radius: 12px; max-width: 760px; width: 100%; padding: 18px 20px; }
.sheet table { border-collapse: collapse; width: 100%; font-size: 14px; }
.sheet th, .sheet td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.zoom img { max-width: min(90vw, 800px); max-height: 85vh; background: #fff; border-radius: 12px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 760px) { .sides { grid-template-columns: 1fr; } .arrow { width: 44px; height: 44px; font-size: 22px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>A/B 비교 검수</h1>
    <span class="small muted" id="run"></span>
    <div class="progress"><div class="small" id="progressText">-</div><div class="track"><div class="fill" id="fill"></div></div></div>
    <select class="ctl" id="filter" aria-label="필터"><option value="all">전체</option><option value="todo">미판정만</option></select>
    <button class="ctl" id="guideBtn">판정 기준</button>
    <button class="ctl" id="summaryBtn">결과 보기</button>
  </div>
</header>
<main>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="이전 (←)">←</button>
    <div class="head"><div class="id" id="pid"></div><div class="msg" id="msg"></div><div class="chips" id="chips"></div></div>
    <button class="arrow" id="next" aria-label="다음 (→)">→</button>
  </div>
  <div id="body"></div>
</main>
<div class="overlay" id="guide"><div class="sheet">
  <button class="ctl" data-close style="float:right">닫기</button>
  <h2>판정 기준</h2>
  <p>같은 요청에 대해 두 설정이 추천한 <b>상위 3개</b>입니다. 어느 쪽 3개가 요청(옷 종류, 촉감, 색 등)에 <b>전체적으로 더 잘 맞는지</b> 고르세요. 사용자는 1~3번을 음성으로 듣습니다.</p>
  <ul><li>차이가 거의 없거나 판단이 어려우면 <b>비슷함</b>.</li><li>A·B가 어느 설정인지는 가려져 있고, "결과 보기"에서 공개됩니다.</li><li>키보드: 1 = A, 2 = 비슷함, 3 = B, ← → 이동.</li></ul>
</div></div>
<div class="overlay" id="summary"><div class="sheet"><button class="ctl" data-close style="float:right">닫기</button><div id="summaryBody"></div></div></div>
<div class="overlay zoom" id="zoom"><img id="zoomImg" alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
const state = { pairs: [], judgments: {}, visible: [], index: 0, run: "" };
const LABEL = { soft: "부드러움", firm: "탄탄함", smooth: "매끄러움", rough: "까끌함", non_elastic: "안 늘어남", elastic: "신축성", thin: "얇음", thick: "두꺼움", flexible: "하늘하늘함", stiff: "뻣뻣함", warm: "따뜻함", cool: "시원함", spongy: "폭신함", crisp: "각 잡힘" };
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else if (v != null) node.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const choiceOf = (pair) => (state.judgments[pair.id] || {}).choice;
function applyFilter() {
  const todo = $("filter").value === "todo";
  const current = state.visible[state.index];
  state.visible = state.pairs.map((_, i) => i).filter((i) => !todo || !choiceOf(state.pairs[i]));
  const kept = state.visible.indexOf(current);
  state.index = kept >= 0 ? kept : Math.min(state.index, Math.max(0, state.visible.length - 1));
}
function progress() {
  const done = state.pairs.filter(choiceOf).length;
  $("progressText").textContent = `판정 ${done} / ${state.pairs.length}`;
  $("fill").style.width = `${state.pairs.length ? done / state.pairs.length * 100 : 0}%`;
}
function side(name, items, win) {
  return el("section", { class: `side ${win ? "win" : ""}`, "aria-label": name },
    el("h2", {}, name),
    el("div", { class: "items" }, items.map((item) => el("div", { class: "item" },
      item.remote_image_url ? el("img", { src: item.remote_image_url, alt: item.title, loading: "lazy", onclick: () => { $("zoomImg").src = item.remote_image_url; $("zoom").classList.add("open"); } }) : el("div", { class: "muted small" }, "이미지 없음"),
      el("div", { class: "t" }, el("span", { class: "n" }, `${item.number}번 `), item.title)))));
}
function render() {
  progress();
  const body = $("body");
  if (!state.visible.length) {
    $("pid").textContent = ""; $("msg").textContent = state.pairs.length ? "모두 판정했습니다" : "비교할 턴이 없습니다"; $("chips").replaceChildren();
    body.replaceChildren(el("div", { class: "empty" }, "필터를 바꾸거나 '결과 보기'를 눌러 주세요."));
    $("prev").disabled = $("next").disabled = true; return;
  }
  const pair = state.pairs[state.visible[state.index]];
  const choice = choiceOf(pair);
  $("pid").textContent = `${pair.turn} · ${pair.title} · ${state.index + 1} / ${state.visible.length}${choice ? " · ✓ 판정함" : ""}`;
  $("msg").textContent = `“${pair.message}”`;
  const s = pair.search || {};
  $("chips").replaceChildren(
    s.category ? el("span", { class: "chip" }, `옷 종류 ${s.category}`) : null,
    ...(s.want || []).map((w) => el("span", { class: "chip" }, `원함 ${LABEL[w] || w}`)),
    ...(s.avoid || []).map((w) => el("span", { class: "chip" }, `피함 ${LABEL[w] || w}`)),
    ...(s.keywords || []).map((w) => el("span", { class: "chip" }, w)));
  const memo = el("textarea", { placeholder: "메모 (선택, 자동 저장)", "aria-label": "메모" });
  memo.value = (state.judgments[pair.id] || {}).memo || "";
  const status = el("div", { class: "state", id: "state" });
  let timer = null;
  memo.addEventListener("input", () => { clearTimeout(timer); status.textContent = "입력 중…"; timer = setTimeout(() => save(pair.id, { memo: memo.value }, false), 600); });
  const button = (value, text) => el("button", { "aria-pressed": String(choice === value), onclick: () => save(pair.id, { choice: choice === value ? null : value }) }, text);
  body.replaceChildren(
    el("div", { class: "sides" }, side("A", pair.a, choice === "A"), side("B", pair.b, choice === "B")),
    el("div", { class: "choice", role: "group", "aria-label": "어느 쪽이 더 맞나" }, button("A", "A가 더 맞음"), button("TIE", "비슷함"), button("B", "B가 더 맞음")),
    memo, status);
  $("prev").disabled = state.index === 0;
  $("next").disabled = state.index >= state.visible.length - 1;
  store.set("pairwise.page." + state.run, pair.id);
}
async function save(id, values, rerender = true) {
  try {
    const r = await fetch("/api/judgments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, values }) });
    const p = await r.json(); if (!r.ok) throw new Error(p.error || r.status);
    state.judgments[id] = p.item;
    if (rerender) {
      if (values.choice && state.index < state.visible.length - 1 && $("filter").value === "all") state.index += 1;  // move on after a choice
      applyFilter(); render(); window.scrollTo({ top: 0 });
    } else { const s = $("state"); if (s) s.textContent = "저장됨"; }
  } catch (e) { alert("저장 실패: " + e.message); }
}
function go(d) { const t = state.index + d; if (t < 0 || t >= state.visible.length) return; state.index = t; render(); window.scrollTo({ top: 0 }); }
async function showSummary() {
  const r = await fetch("/api/summary"); const data = await r.json();
  const rows = Object.entries(data.settings).map(([name, s]) => el("tr", {}, el("td", {}, name), el("td", {}, `${s.judged} / ${s.pairs}`),
    el("td", {}, String(s.candidate)), el("td", {}, String(s.baseline)), el("td", {}, String(s.tie))));
  $("summaryBody").replaceChildren(el("h2", {}, "결과 (이름 공개)"),
    el("p", { class: "small muted" }, `기준 설정: ${data.baseline}. 후보가 더 맞다고 고른 턴이 많을수록 후보 설정이 낫다는 뜻입니다.`),
    el("table", {}, el("tr", {}, ["후보 설정", "판정", "후보가 더 맞음", "기준이 더 맞음", "비슷함"].map((t) => el("th", {}, t))), rows));
  $("summary").classList.add("open");
}
async function load() {
  const r = await fetch("/api/data"); const data = await r.json();
  state.pairs = data.pairs; state.judgments = data.judgments || {}; state.run = data.run;
  $("run").textContent = data.run;
  applyFilter();
  const saved = state.pairs.findIndex((p) => p.id === store.get("pairwise.page." + state.run, ""));
  if (saved >= 0) state.index = Math.max(0, state.visible.indexOf(saved));
  render();
}
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("filter").onchange = () => { applyFilter(); render(); };
$("guideBtn").onclick = () => $("guide").classList.add("open");
$("summaryBtn").onclick = showSummary;
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => document.querySelectorAll(".overlay").forEach((o) => o.classList.remove("open")));
document.querySelectorAll(".overlay").forEach((o) => o.addEventListener("click", (e) => { if (e.target === o || o.id === "zoom") o.classList.remove("open"); }));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return document.querySelectorAll(".overlay").forEach((o) => o.classList.remove("open"));
  if (["TEXTAREA", "SELECT"].includes(document.activeElement.tagName) || document.querySelector(".overlay.open")) return;
  const pair = state.pairs[state.visible[state.index]];
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  else if (pair && ["1", "2", "3"].includes(e.key)) save(pair.id, { choice: { 1: "A", 2: "TIE", 3: "B" }[e.key] });
});
load().catch((e) => { $("msg").textContent = "불러오기 실패: " + e.message; });
</script>
</body>
</html>
