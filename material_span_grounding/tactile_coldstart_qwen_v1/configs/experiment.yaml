experiment:
  id: tactile_coldstart_qwen_v1
  seed: 20260822
  split_seeds: [20260822, 20260823, 20260824]
  ratios: {train: 0.70, development: 0.15, test: 0.15}

inputs:
  reviews: /home/user/onsesang/material_span_grounding/data/dense/reviews_product_dense.jsonl
  semantic_verifications: /home/user/onsesang/material_span_grounding/data/vllm/dense_500/v2_1_ai_recall/semantic_verifications.jsonl
  verification_manifest: /home/user/onsesang/material_span_grounding/data/vllm/dense_500/v2_1_ai_recall/verification_run.json
  product_master: /home/user/onsesang/material_span_grounding/data/derived/multimodal_catalog_v1/product_master.json
  fashionclip_embeddings: /home/user/onsesang/material_span_grounding/data/derived/multimodal_catalog_v1/fashionclip_image_embeddings.npz
  open_review_targets: /home/user/onsesang/material_span_grounding/data/derived/multimodal_catalog_v1/family_review_targets.npz
  image_root: /home/user/onsesang/texture_project/images_train

semantic_labeler:
  provider: qwen
  backend: transformers_bnb4
  model_id: Qwen/Qwen3-VL-8B-Instruct
  snapshot: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  mode: instruct
  temperature: 0.0
  seed: 42
  prompt_version: tactile_axis_grounding_v1
  schema_version: tactile_axis_mapping_v1
  max_model_len: 4096
  max_tokens: 180
  chunk_size: 12
  max_attempts: 2

diagnostics:
  selection_splits: [train, development]
  selection_seed_policy: intersection_across_all_evaluated_seeds
  min_mapped_spans: 30
  min_unique_products: 20
  min_products_per_pole: 5
  min_multi_reviewer_products: 3
  max_top_category_fraction: 0.90
  min_mean_mapping_confidence: 0.75
  accessible_external_sources: [mllm_fabric]
  audit_sample_size: 600
  audit_intensity_order: [none, slight, moderate, strong]

targets:
  minimum_mapping_confidence: 0.0
  score_bins: [-2, -1, 0, 1, 2]

models:
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]
  pairwise_margin: 0.5
  pairwise_min_support: 1
  pairwise_min_agreement: 0.0
  mlp_hidden_dim: 64
  mlp_epochs: 250
  mlp_patience: 30
  mlp_learning_rate: 0.001
  bootstrap_samples: 500

image_encoders:
  fashionclip: {model_id: patrickjohncyh/fashion-clip, revision: 7e3ba62ce16b379a1ab479346b66f192e76f51b7, frozen: true}
  dino: {model_id: facebook/dinov2-small, revision: ed25f3a31f01632728cabb09d1542f84ab7b0056, frozen: true, batch_size: 32}

open_vector_baseline:
  text_encoder: {model_id: BAAI/bge-small-en-v1.5, revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a}

vlm_zero_shot:
  enabled: true
  batch_size: 2
  max_image_side: 448
  max_tokens: 512
  prompt_version: tactile_image_zero_shot_v1
  schema_version: tactile_image_axes_v1

selective:
  fixed_coverages: [1.0, 0.8, 0.6, 0.4]
  ensemble_members: 20
  correctness_tolerance: 0.75
  primary_coverage: 0.8
  calibration_bins: 10

retrieval:
  k: [5, 10, 20]
  minimum_test_support: 1
  query_strengths: [1.0, 2.0]
  unknown_penalties: [0.0, -0.1]
  minimum_candidates: 4
  minimum_relevant: 1
  maximum_relevance: 3.0
  multi_axis_max_constraints: 2
  random_seed: 20260822
  fashionclip_query_template: "a product made from {pole} material"

external:
  mllm_fabric_repo: EuniceF/MLLM-Fabric
  leeds_status: access_not_publicly_verified
  split_seed: 20260822
  recoverability_calibration_fraction: 0.5

reporting:
  bootstrap_samples: 1000
  confidence_level: 0.95
  hypothesis_margin: 0.0
